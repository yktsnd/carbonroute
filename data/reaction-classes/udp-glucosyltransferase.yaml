# Reaction class: UDP-hexose-dependent O-glycosylation
#
# Covers every Rhea reaction consuming UDP-alpha-D-glucose (CHEBI:58885),
# UDP-alpha-D-galactose (CHEBI:66914), or one of six sibling hexose donors as
# a reactant. All eight are hexoses -- glucose, galactose (its C4 epimer) or
# mannose (its C2 epimer), each carried by a different nucleotide (UDP, GDP,
# ADP, dTDP or CDP) -- so every one transfers the identical anhydrohexosyl
# unit, 162.14 g/mol, and one template covers all of them without a second
# piece of research. See "why galactose is free" below; the same reasoning
# now covers six more donors for the same reason.
#
# THE SIX SIBLINGS, ADDED FOR FREE: GDP-alpha-D-mannose (CHEBI:57527, 55
# reactions in Rhea -- mannose, glucose's C2 epimer), ADP-alpha-D-glucose
# (CHEBI:57498, 11 -- the same glucose, carried by ADP), GDP-alpha-D-glucose
# (CHEBI:62230, 8), UDP-alpha-D-galactofuranose (CHEBI:66915, 7 -- the
# furanose ring form of UDP-galactose, same molecular formula), dTDP-
# alpha-D-glucose (CHEBI:57477, 3) and CDP-alpha-D-glucose (CHEBI:137927, 1).
# Run through the actual screen: 72 newly matched, 63 newly decided (87.5%).
# The other 9: 4 could not be resolved to a single acceptor/product pair; 5
# excluded by mass delta -- 3 at 240.10 g/mol (a different, larger group), 1
# at 0.00 (an isomerisation, no real transfer) and 1 at -324.28 (twice
# 162.14 with the sign flipped, an acceptor/product resolution artifact) --
# none investigated further since the mass-delta check already does its job
# of keeping them out of the decided set. Combined with the original two
# donors: 478 matched (was 406), 451 decided (was 388).
#
# EVERY DOWNSTREAM FINDING IN README.md's Q1/Q2 SECTIONS WAS RE-DERIVED
# AGAINST THIS EXTENDED SET, NOT ASSUMED TO CARRY OVER: the 388-of-388
# "rests on ethyl acetate" finding reproduces exactly as 451-of-451 (median
# concentration unchanged, 0.7967), the 25-reaction guaranteed-floor set is
# IDENTICAL (same 25 RHEA ids, not just the same count), the calibration
# reaction's own threshold (RHEA:12560, 85.87%) is unaffected, and the
# break-even frontier was re-swept rather than rescaled by assumption.
#
# All of these reactions are the same transformation: an enzyme transfers a
# hexose from a UDP-sugar onto an acceptor's hydroxyl.
#
# The chemical counterpart below is NOT a hypothetical. It is one real,
# fully-quantified published procedure -- the Helferich/BF3 glycosylation of
# Cepanec & Litvic (ARKIVOC 2008) -- reduced to amounts per mole of product,
# so it can be instantiated against any acceptor in the class. That paper is
# the same source the hand-built case study in
# examples/case-studies/beta-arbutin-chemical-vs-enzymatic/ uses, and the
# reaction it describes (RHEA:12560) is a member of this class, which is what
# lets the screen be calibrated against a fully-sourced ledger rather than
# only against itself.
#
# WHAT IS ASSUMED, PLAINLY: that a chemical route to any other acceptor in
# this class looks like this procedure. That is the screening assumption, and
# it is the reason the output of a screen is a ranked shortlist of candidates
# for a real `carbonroute compare`, not a verdict about any individual
# reaction. Every material below declares whether its amount is `sourced`
# (read from that paper) or `generalised` (extended beyond what the paper
# itself did), and says how in its note.

reaction_class:
  id: udp-glucosyltransferase
  name: "UDP-hexose-dependent O-glycosylation"
  description: >
    Enzymatic transfer of a hexose (glucose, galactose or mannose) from a
    nucleotide-diphosphate sugar onto an acceptor hydroxyl, releasing the
    nucleotide-diphosphate. In Rhea this is EC 2.4.1.x; matching is done on
    the cofactor rather than the EC number, because many Rhea reactions
    carry no EC annotation at all while every member of this class
    necessarily consumes one of the cofactors below.
  # A genuine hexosylation adds one anhydrohexosyl unit (C6H10O5) to the
  # acceptor: 6*12.011 + 10*1.008 + 5*15.999 = 162.14 g/mol, verified via
  # RDKit against hydroquinone -> beta-arbutin (162.141 observed) for the
  # glucose donor. Galactose and mannose are its C4 and C2 epimers -- same
  # molecular formula, so the identical 162.14 -- verified the same way via
  # RDKit. Reactions that consume a class cofactor without adding this mass
  # -- there are a handful, e.g. isomerisations or reactions this parser
  # mis-identifies the acceptor/product for -- are excluded rather than
  # mis-templated; see screen.py's ClassTemplate.matches for why this check
  # exists at all.
  expected_mass_delta: 162.14
  mass_delta_tolerance: 1.0
  # Eight interchangeable hexose-nucleotide donors for this class (see the
  # file header for which reaction count each contributes). A donor that
  # transfers a *different* group -- UDP-N-acetylglucosamine, say, which
  # adds an extra acetamido group, or UDP-xylose, a pentose -- is
  # deliberately not listed here: its expected_mass_delta would not be
  # 162.14, so it needs its own class, not another entry in this list.
  cofactor_chebi:
    ["CHEBI:58885", "CHEBI:66914", "CHEBI:57527", "CHEBI:57498",
     "CHEBI:62230", "CHEBI:66915", "CHEBI:57477", "CHEBI:137927"]
  cofactor_role: reagent

chemical_counterpart:
  name: "Helferich glycosylation of a peracetylated donor, with BF3.Et2O, then saponification"
  source: >
    Cepanec, I.; Litvic, M. "Simple and efficient synthesis of arbutin."
    ARKIVOC 2008 (ii), 19-24. https://www.arkat-usa.org/get-file/22982/
    Full PDF fetched and read directly. Reported yields: donor preparation
    99.2%, glycosylation 62% (limiting reagent: the peracetylated sugar),
    deprotection 85%. Every `sourced` amount below is that paper's own
    charged quantity, divided by the moles of beta-arbutin the same procedure
    isolates (1 kg = 3.6731 mol, MW 272.253), and is reproduced in
    examples/case-studies/beta-arbutin-chemical-vs-enzymatic/SOURCES.md.

  # 0.62 glycosylation x 0.85 deprotection. Already folded into every amount
  # above, because those are stated per mole of *product* -- so this field
  # is never multiplied in again. It is here to be read next to the
  # enzymatic conversion a screen is run at: the chemical side of this
  # comparison arrives discounted for real losses, and an enzymatic side
  # billed at bare stoichiometry does not. The screen prints both so the
  # asymmetry cannot hide.
  source_overall_yield: 0.527

  assumptions_note: >
    Two simplifications, both stated because both push the result in a
    direction a reader should know about.
    (1) The deprotection stage's reagents are held FIXED per mole of product
    rather than scaling with the number of acetyl groups actually removed.
    The paper's substrate carries six (five on the sugar, one on the
    acceptor); an acceptor needing more masking would carry more, and its
    real deprotection burden would be higher than modelled here. This makes
    the chemical route look BETTER than it is for polyol acceptors -- i.e. it
    is conservative against the "the enzyme wins" conclusion a screen is
    looking for.
    (2) The acceptor-protection stage is scaled by the acceptor's own count
    of protectable groups minus one (the position the reaction is meant to
    modify), counted from the acceptor's SMILES. The paper protected exactly
    one group, so its own amounts correspond to a scale of 1.

  materials:

    # --- Stage 1: mask the acceptor's other reactive groups -----------------
    # These scale with how many groups the acceptor has that a non-selective
    # chemical reagent would also attack. The enzyme masks nothing.
    - name: acetic anhydride
      cas: "108-24-7"
      role: reagent
      kg_per_mol_product: 0.102089
      per_protected_group: true
      basis: generalised
      note: >
        One equivalent per group masked (MW 102.089, verified via RDKit from
        SMILES CC(=O)OC(C)=O; CAS confirmed live against PubChem CID 7918).
        The source paper did NOT use acetic anhydride: it exploited a
        transesterification between hydroquinone and hydroquinone diacetate,
        a trick available only because its acceptor is a symmetric diol.
        Acetic anhydride at one equivalent is the standard general reagent
        for the same job and is substituted here so the template can apply to
        acceptors that are not symmetric diols. This is the single largest
        generalisation in this template.
    - name: toluene
      cas: "108-88-3"
      role: solvent
      kg_per_mol_product: 2.98514
      per_protected_group: true
      basis: generalised
      note: >
        Amount is sourced (60 mL reaction + 60 mL dilution of toluene per
        0.1 mol basis, density 0.867, = 10.9647 kg per kg of product); the
        per-masked-group scaling is the generalisation.
    - name: sulfuric acid
      cas: "7664-93-9"
      role: reagent
      kg_per_mol_product: 0.005347
      per_protected_group: true
      basis: generalised
      note: >
        Catalytic acid for the protection stage, 2 mol% (0.1 mL, 184 mg,
        1.9 mmol per 0.1 mol basis). Amount sourced; per-group scaling
        generalised.
    - name: water
      cas: "7732-18-5"
      role: solvent
      kg_per_mol_product: 4.30383
      per_protected_group: true
      basis: generalised
      note: >
        Aqueous wash after the protection stage (3 x 50 mL per 0.1 mol
        basis). Amount sourced; per-group scaling generalised.

    # --- Stage 2: the glycosylation itself ---------------------------------
    # Fixed per mole of product: this is the bond-forming step the enzyme
    # also performs, and its reagents do not depend on the acceptor.
    - name: 1,2,3,4,6-penta-O-acetyl-beta-D-glucopyranose
      cas: "604-69-3"
      role: reactant
      kg_per_mol_product: 0.740680
      basis: sourced
      note: >
        The protected sugar donor -- the chemical counterpart of the enzyme's
        UDP-glucose. 3.90 g (10 mmol) charged per 10 mmol basis, carried
        through the paper's 62% glycosylation and 85% deprotection yields
        (1.897 mol per mol of product, MW 390.34). For a UDP-galactose-
        consuming reaction this same entry stands in for the penta-O-acetyl-
        beta-D-galactopyranose donor (a different CAS, 25878-95-7), which the
        source paper did not itself use: this is `generalised`, not
        `sourced`, for those rows. The mass and mole count are unaffected --
        glucose and galactose peracetates share the same molecular formula
        and MW (390.34) -- and no published factor distinguishes them in the
        tables this project loads, so the bound in
        udp-glucosyltransferase.bounds.yaml applies to either.
    - name: boron trifluoride diethyl etherate
      cas: "6681-36-3"
      role: catalyst
      kg_per_mol_product: 0.269310
      basis: sourced
      note: >
        Lewis-acid activator, 1.0 equivalent relative to the donor (50%
        solution, 2.5 mL, 10 mmol per 10 mmol basis). Stoichiometric, not
        catalytic in practice, which is one of the structural differences
        from the enzymatic route.
    - name: dichloromethane
      cas: "75-09-2"
      role: solvent
      kg_per_mol_product: 12.570990
      basis: sourced
      note: >
        Anhydrous reaction solvent for the glycosylation (50 mL per 10 mmol
        basis, density 1.325). The enzymatic route runs in water.

    # --- Stage 3: remove every acetyl group --------------------------------
    # Held fixed per mole of product -- see assumptions_note (1).
    - name: potassium carbonate
      cas: "584-08-7"
      role: reagent
      kg_per_mol_product: 2.435270
      basis: sourced
      note: >
        Saponification base, 15 equivalents per mole of peracetylated
        intermediate (2.07 g, 15 mmol per 1 mmol basis).
    - name: methanol
      cas: "67-56-1"
      role: solvent
      kg_per_mol_product: 46.587650
      basis: sourced
      note: "Deprotection solvent (50 mL per 1 mmol basis, density 0.792)."
    - name: ethyl acetate
      cas: "141-78-6"
      role: solvent
      kg_per_mol_product: 159.174480
      basis: sourced
      note: >
        Product extraction (3 x 50 mL boiling EtOAc per 1 mmol basis, density
        0.902). This is the largest single mass in the template and reflects
        a bench-scale isolation; a plant would recover most of it, which is
        why solvent recovery is the first thing to sweep on any reaction this
        screen returns as decided.

    # Water and sulfuric acid appear in stage 1 as well; the engine sums
    # entries that share a material key, so these add to the amounts above
    # rather than replacing them. They are listed separately because they
    # carry a different scaling: fixed per mole of product, not per masked
    # group.
    - name: water
      cas: "7732-18-5"
      role: solvent
      kg_per_mol_product: 11.764560
      basis: sourced
      note: "Aqueous co-solvent for the deprotection (10 mL per 1 mmol basis)."
    - name: sulfuric acid
      cas: "7664-93-9"
      role: reagent
      kg_per_mol_product: 0.870570
      basis: sourced
      note: >
        Quench of the saponification base (0.4 mL, 0.74 g, 7.5 mmol per
        1 mmol basis).

# --- What running the enzyme actually costs --------------------------------
#
# The enzymatic side of this diff used to be one line: the cofactor. That
# quietly assumed everything else about operating an enzyme is free. Two
# things are not, and they behave oppositely as a process is pushed harder:
#
#   * a REGENERATION co-substrate is consumed on every catalytic cycle, so
#     recycling the cofactor never buys it down -- charge: per_turnover;
#   * an IMMOBILISED enzyme preparation is bought once and reused over many
#     batches, so its burden divides by the cycle count -- charge: amortised.
#
# Declaring measures rather than hard-coding one shape is deliberate. A
# different class may regenerate with formate dehydrogenase, an electrode or
# a whole cell, and may or may not immobilise; the template says which, and
# the code does not assume. `screen_reaction` refuses any cofactor_recycling
# unless some measure here is marked enables_recycling, because a turnover
# number with nothing driving it is a free lunch.
enzymatic_process:
  measures:

    - name: sucrose
      chebi: "CHEBI:17992"
      role: reagent
      charge: per_turnover
      enables_recycling: true
      # 4.196 mol of sucrose per mole of product, times 342.297 g/mol.
      #
      # This is the amount a real cascade CHARGES, not the 1:1 stoichiometry
      # of the SuSy equation -- a regeneration system runs sucrose in large
      # excess to drive the equilibrium. Derived from Liu et al.'s own stated
      # concentrations, with the arithmetic shown so it can be checked:
      #   charged   sucrose 500 mM, UDP 0.5 mM, phloretin (acceptor) 120 mM
      #   product   nothofagin at ~52 g/L; MW 436.41 (phloretin 274.27 +
      #             162.14 anhydrohexosyl, both via RDKit)
      #             => 52 / 436.41 * 1000 = 119.2 mM product
      #   so        500 / 119.2 = 4.196 mol sucrose per mol product
      #             4.196 * 0.342297 = 1.4364 kg/mol product
      #
      # Two independent checks on that derivation, both from the paper's own
      # numbers: 119.2 mM product against 120 mM acceptor is 99.3%
      # conversion, and 0.5 mM UDP against 119.2 mM product implies a
      # turnover number of 238, against the 240 the authors state. Neither
      # was fitted; they agree because the derivation is right.
      #
      # The previous figure here was the theoretical one sucrose per
      # turnover, 0.342297 kg/mol. It understated this by 4.2x, and in the
      # direction that flatters the enzymatic route.
      kg_per_mol_product: 1.4364
      basis: generalised
      source: >
        Liu, H.; Tegl, G.; Nidetzky, B. "Glycosyltransferase
        Co-Immobilization for Natural Product Glycosylation: Cascade
        Biosynthesis of the C-Glucoside Nothofagin with Efficient Reuse of
        Enzymes." Adv. Synth. Catal. 2021, 363(8), 2157-2169.
        doi:10.1002/adsc.202001549. Open access, CC BY 4.0. Charged
        concentrations (500 mM sucrose, 0.5 mM UDP, 120 mM phloretin), the
        ~52 g/L product titre and the stated 240-fold UDP-glucose recycling
        are all the paper's own figures; the per-mole-of-product conversion
        above is arithmetic on them, set out in full in the comment.
        The 1:1 SuSy stoichiometry it rests on is Rhea's curated RHEA:55092
        (EC 2.4.1.13).
      note: >
        `generalised`, for one specific reason that matters: Liu et al.
        run a C-glycosyltransferase (OsCGT) cascade making a C-glucoside,
        while this class is O-glycosylation. The sucrose/UDP regeneration
        half is the same chemistry and is what is borrowed here; the
        acceptor chemistry is not. An O-UGT cascade may charge differently,
        and replacing this with charged amounts from an O-glycosylation
        paper would upgrade it to `sourced`. Trobo-Maseda et al. 2020
        (doi:10.1016/j.ijbiomac.2020.04.120) is the right O-glycosylation
        system -- resveratrol glucoside, coimmobilised O-GT and SuSy, UDP
        cycle TTN 91.7 over 10 batch cycles -- but its charged sucrose, UDP
        loading, titre and reaction volume were not obtainable, so it cannot
        replace this yet.

# REFERENCE OPERATING POINT for --cofactor-recycling, from the same paper:
#
#   Liu et al. state the UDP-glucose was recycled 240 times, which is a
#   cofactor_recycling of 1 - 1/240 = 0.99583. That is a real, published,
#   immobilised cascade rather than a round number, and it is the value to
#   use when asking what a serious enzymatic process achieves. Independently
#   implied by their own concentrations as 238 (see the derivation above).
#
#   For contrast, Trobo-Maseda et al. 2020 report a UDP-cycle TTN of 91.7
#   (recycling 0.9891) for a coimmobilised O-glycosyltransferase/SuSy system
#   over 10 batch cycles. Both are experimental; they differ by enzyme,
#   support, acceptor and conditions, so both are worth sweeping rather than
#   averaging.

# NOT DECLARED, AND THAT IS ITSELF A GAP:
# NOT DECLARED, AND THAT IS ITSELF A GAP:
#
# An immobilised enzyme preparation and its carrier belong here as a second,
# `charge: amortised` measure. Two of the three numbers that needs now exist:
#
#   reuse_cycles  Yue et al. 2024 (doi:10.1021/acsami.4c14661) co-immobilise
#                 UGT and SuSy on a NiCo metal-organic framework and report
#                 10 cycles at 68.97% residual activity, with a loading of
#                 115.9 mg enzyme per g of support. Trobo-Maseda et al. 2020
#                 independently report up to 10 batch cycles.
#   enzyme GWP    bounded in the .bounds.yaml alongside this file, from
#                 Nielsen et al. 2007 and Gilpin & Andrae 2017.
#
# The one still missing is the bridge between them: enzyme mass per mole of
# PRODUCT. Yue gives enzyme per gram of carrier and Liu gives product titre,
# but neither states the enzyme loading on a per-product basis, and it cannot
# be derived from what they do state. Without it there is no way to convert a
# per-kg-enzyme GWP into a per-kg-product charge, so no measure is written.
#
# The enzyme is therefore still absent from this diff, which understates the
# enzymatic route -- the same direction as every other gap noted above. It is
# left undeclared rather than filled with a plausible number.

# --- The chemical route as a declared process, not one paper's bench run ---
#
# WHY THIS EXISTS. `explain_verdict` measured what the paper-sourced template
# above actually decides: in all 388 decided reactions of this class, at least
# half the delta comes from one number, and it is the same number every time
# -- Cepanec & Litvic's 150 mL of boiling ethyl acetate per millimole, or
# 159 kg per mole of product. Every verdict this class produces is, to first
# order, a statement about one author's isolation habits.
#
# Choosing a different paper does not fix that. It substitutes a different
# author's habits, with no principled way to pick between them. What fixes it
# is to stop claiming a paper and start declaring a model.
#
# THIS IS LESS PRECISE AND MORE HONEST. Nothing below is read from a
# procedure, so every figure is `generalised` by construction. What it buys:
# the parameters are chemistry-independent, so the next class supplies its own
# reagents and inherits the process -- which is what makes coverage possible
# at all, given that three sessions of literature search produced zero new
# templates.
#
# Screen with --process-model to use it, and against the paper template to see
# how much of any answer was the paper.
process_model:
  name: "Protected group-transfer, run at process concentration with a plant-style isolation"
  source: >
    Not a paper, deliberately, and not presented as one. Every parameter is a
    declared modelling choice with its justification in `note`. The model is
    calibrated against the one reaction in this repository with a hand-built
    sourced ledger (RHEA:12560, beta-arbutin), and the comparison against the
    paper-sourced template is reported rather than hidden.
  # 0.2 mol of product per litre. Bench procedures commonly run far more
  # dilute -- the source paper's isolation alone works out near 0.03 M -- and
  # process chemistry pushes concentration up because vessel volume is the
  # thing that costs. 0.2 M is a deliberately conservative process figure: it
  # is not aggressive, and raising it only helps the chemical route.
  reaction_concentration_M: 0.2
  # Per stage. The source paper reports 62% glycosylation and 85%
  # deprotection; 0.85 per stage is in that range and is applied uniformly
  # rather than tuned per stage, because tuning it per stage would be fitting
  # the model to the paper it is meant to be independent of.
  stage_yield: 0.85
  note: >
    The single largest modelling choice is the isolation: 3 extraction volumes
    plus 2 wash volumes, against the source paper's ~30 reaction volumes of
    boiling ethyl acetate. That is the difference between recovering solvent
    and not choosing to use it, and it is the whole reason this model exists.
    Read every number here as a declared assumption that a process chemist can
    disagree with by editing one line -- which is the point, and is not
    available when the amounts come from a paper.
  stages:

    - id: protect
      # Repeated once per group the acceptor must mask. The count comes from
      # the acceptor's own structure, not from this model.
      per_protected_group: true
      volumes: 1.0
      solvent: {name: toluene, cas: "108-88-3", density_kg_per_L: 0.867}
      reagents:
        - name: acetic anhydride
          cas: "108-24-7"
          kg_per_mol: 0.102089
          equivalents: 1.1
          note: >
            1.1 equivalents per group masked. Slight excess over stoichiometry
            is normal practice for an acylation; 1.1 is at the low end.

    - id: couple
      volumes: 1.0
      solvent: {name: dichloromethane, cas: "75-09-2", density_kg_per_L: 1.325}
      reagents:
        - name: 1,2,3,4,6-penta-O-acetyl-beta-D-glucopyranose
          cas: "604-68-2"
          kg_per_mol: 0.390340
          equivalents: 1.2
          note: >
            The glycosyl donor, 1.2 equivalents. Donor excess is how a
            Helferich-type coupling is driven; 1.2 is modest.
        - name: boron trifluoride diethyl etherate
          cas: "109-63-7"
          kg_per_mol: 0.141930
          equivalents: 1.0
          note: >
            Promoter, stoichiometric rather than catalytic -- which is what
            the chemistry actually requires and is charged as such.

    - id: deprotect
      volumes: 1.0
      solvent: {name: methanol, cas: "67-56-1", density_kg_per_L: 0.792}
      reagents:
        - name: potassium carbonate
          cas: "584-08-7"
          kg_per_mol: 0.138205
          equivalents: 2.0
          note: >
            2 equivalents for a Zemplen-type saponification. The paper-sourced
            template charges roughly 17 equivalents, which is a bench habit
            rather than a requirement.

    - id: isolate
      # The parameter this model exists to make arguable. 3 extraction volumes
      # and 2 wash volumes, i.e. 5 reaction volumes total, against the source
      # paper's ~30. A plant crystallises or extracts continuously; it does not
      # boil 150 mL of ethyl acetate per millimole.
      volumes: 5.0
      solvent: {name: ethyl acetate, cas: "141-78-6", density_kg_per_L: 0.902}
      reagents: []
