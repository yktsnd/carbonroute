# Reaction class: O2-dependent fatty acyl desaturation
#
# Covers Rhea reactions consuming O2 (CHEBI:15379) as a reactant, restricted
# to EC 1.14.19 -- fatty acyl-CoA/-ACP/-lipid desaturases. Unlike the
# o2-monooxygenase and p450-monooxygenase classes (which insert an oxygen
# atom into the acceptor), this EC group's dominant chemistry REMOVES two
# hydrogens to form a new C=C double bond, reducing O2 fully to 2 H2O with
# four electrons from the co-substrate (octadecanoyl-[ACP] -> (9Z)-
# octadecenoyl-[ACP], a classic stearoyl-ACP desaturase reaction). Net mass
# change: -2.016 g/mol, the same signature the NAD(P)+-oxidoreductase class
# targets for 2H-loss oxidation -- this class is really "the same
# dehydrogenation chemistry, powered by O2/four-electron donors instead of
# NAD(P)+", not a relative of the two monooxygenase classes despite sharing
# their cofactor.
#
# FIVE co-cofactor identities cover the large majority of this class's
# electron donors, each a real but unpriced second (or, here, doubled)
# cofactor: Fe(II)-[cytochrome b5] (CHEBI:29033, 45 reactions), reduced
# [NADPH--hemoprotein reductase] (CHEBI:57618, 23 -- the same entity the
# p450-monooxygenase class already declares), reduced [2Fe-2S]-[ferredoxin]
# (CHEBI:33738, 22), NADPH (CHEBI:57783, 10) and FADH2 (CHEBI:58307, 8).
# Several reactions consume TWO equivalents of a donor (2 Fe(II)-cytochrome
# b5, 2 reduced ferredoxin) for the four-electron reduction of O2 to two
# waters -- cofactor_coeff is not involved here since these donors are
# unpriced, so the doubled stoichiometry does not need separate handling.
#
# THE UNPRICED GAP, STATED PLAINLY: as with the two monooxygenase classes,
# the electron donor's own regeneration cost is real and this template does
# NOT charge it.
#
# With EC 1.14.19 still in place: 115 reactions match O2. 92 (80.0%)
# resolve to a single acceptor/product pair within tolerance and are
# decided, every one decisively favouring the enzyme -- including
# RHEA:11776 (octadecanoyl-[ACP] -> (9Z)-octadecenoyl-[ACP]), the reaction
# the class was designed around. 19 could not be resolved to a single
# acceptor/product pair -- reactions whose acceptor is written alongside a
# further small-molecule reactant (chloride, bromide, L-tryptophan) this
# class's co-cofactor list does not cover, because those ARE genuinely
# different chemistry (halogenases, not desaturases) rather than
# something safe to also declare unpriced. The other 4 are correctly
# excluded by mass delta: oxidative DIMERISATION (RHEA:26031/26035, two
# flaviolin molecules coupling to a biflaviolin, +202.12 -- a new C-C bond
# between two acceptor molecules, not a desaturation of one), a complex
# multi-O2 reaction losing HCN and CO2 (RHEA:52776, -75.07), and an
# oxidative decarbonylation-type loss of formate (RHEA:58520, -29.02) --
# none folded in as noise.
#
# STAGE 2: ec_prefix REPLACED BY required_co_cofactor_chebi, the same step
# taken across all six O2 classes -- see o2-monooxygenase.yaml's own
# header for the full rationale. With ec_prefix dropped: 1,534 reactions
# match, 267 decide, all decisively favouring the enzyme, zero of the 92
# previously-decided reactions lost. This class's required list is the
# widest of the six (all five of its known electron-donor identities,
# each shared with at least one other O2 class -- Fe(II) and 2Fe-2S with
# ferredoxin-monooxygenase, the P450-reductase flavin with
# p450-monooxygenase, NADPH with o2-monooxygenase), so its "matched" count
# overlaps heavily with the other five: most of the 1,534 are candidates
# this class's own expected_mass_delta (-2.016, the opposite sign of the
# four +15.999 classes) correctly does not decide. Verified: zero
# reactions decide for both this class and any other O2 class -- the
# mass-delta sign is the real tiebreaker, co-cofactor identity alone is
# not sufficient here, unlike the cleaner p450/2og/ferredoxin splits. Every
# newly decided reaction was spot-checked -- all show a genuine -2.016
# desaturation/dehydrogenation with one of the five donors, e.g.
# RHEA:65820 (decanoyl-[ACP] + 2 reduced [2Fe-2S]-ferredoxin + O2 ->
# dec-9-enoyl-[ACP]), none carrying an EC annotation.

reaction_class:
  id: o2-desaturase
  name: "O2-dependent fatty acyl desaturation"
  description: >
    Enzymatic removal of two hydrogens to form a new C=C double bond in a
    fatty acyl chain, reducing O2 fully to two water molecules with
    electrons from a co-substrate this class does not price. Matched on O2
    and on one of five known electron-donor identities being present; no
    ec_prefix is declared.
  expected_mass_delta: -2.016
  mass_delta_tolerance: 1.0
  cofactor_chebi: "CHEBI:15379"
  cofactor_role: reagent
  required_co_cofactor_chebi:
    ["CHEBI:29033", "CHEBI:57618", "CHEBI:33738", "CHEBI:57783", "CHEBI:58307"]
  unpriced_co_cofactor_chebi:
    ["CHEBI:29033", "CHEBI:57618", "CHEBI:33738", "CHEBI:57783", "CHEBI:58307"]

chemical_counterpart:
  name: "Declared process model only -- see process_model below"
  source: >
    No chemical_counterpart.materials are declared for this class; it ships
    with a process_model instead (see below) and must be screened with
    --process-model. Same rationale as the other process-model-only
    classes: see docs/screening.md's "A declared process, instead of one
    paper's bench run".
  materials: []

# --- The chemical route as a declared process -------------------------------
process_model:
  name: "IBX oxidation-elimination-shaped stoichiometric dehydrogenation, at process concentration"
  source: >
    Not a paper. Reused directly from the NAD(P)+-oxidoreductase class's
    own process model: TEMPO/NaOCl/KBr is a standard chemoselective
    stoichiometric oxidant system, the same textbook chemical counterpart
    to a 2H-loss dehydrogenation regardless of whether the enzymatic
    mechanism is NAD(P)+-driven or O2-driven -- the chemical route does not
    know or care which cofactor the enzyme used. Parameters stated on the
    same terms the other process models use.
  reaction_concentration_M: 0.2
  stage_yield: 0.9
  note: >
    No protection stage is modelled, for the same conservative reason the
    other process-model classes omit one.
  stages:

    - id: oxidise
      volumes: 1.0
      solvent: {name: water, cas: "7732-18-5", density_kg_per_L: 1.0}
      reagents:
        - name: sodium hypochlorite
          cas: "7681-52-9"
          kg_per_mol: 0.074442
          equivalents: 1.3
          note: >
            1.3 equivalents of the stoichiometric oxidant.
        - name: potassium bromide
          cas: "7758-02-3"
          kg_per_mol: 0.119002
          equivalents: 0.1
          note: >
            Catalytic co-oxidant, 10 mol%.
        - name: TEMPO
          cas: "2564-83-2"
          kg_per_mol: 0.156252
          equivalents: 0.05
          note: >
            Catalytic radical mediator, 5 mol%.

    - id: isolate
      volumes: 5.0
      solvent: {name: ethyl acetate, cas: "141-78-6", density_kg_per_L: 0.902}
      reagents: []
