# Bounds for the materials this reaction class's screen cannot resolve to a
# public factor. See docs/bounds.md for what a bound is and, more
# importantly, what it is not: nothing here is a factor, none of it enters a
# Monte Carlo or a total, and coverage is reported unchanged.
#
# The enzymatic side (ATP) carries the class's whole stoichiometric cost, so
# its HIGH bound is load-bearing, by the same convention the other classes
# use for their cofactors. The two chemical-side reagents are unresolved and
# only their LOW bounds matter.

bounds:

  # ---- The enzymatic side -------------------------------------------------
  "name:chebi:30616":
    low: 0.5
    high: 100.0
    rationale: >
      ATP. No public cradle-to-gate factor was found. Same interval and
      same reasoning as the cofactors in the other shipped classes:
      deliberately wide because it is not known, spanning from below the
      cheapest bulk organic in the loaded tables up to well above the
      highest specialty figure this project has found cited.
    sources:
      - "No public cradle-to-gate GWP for ATP was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (the low anchor, by the same convention as the other classes)."

  # ---- The chemical side ---------------------------------------------------
  "cas:10025-87-3":
    low: 0.4
    high: null
    rationale: >
      Phosphoryl chloride. No public cradle-to-gate factor was found. Low
      bound only, by the same convention every other unresolved
      chemical-side reagent in this project uses.
    sources:
      - "No public cradle-to-gate GWP for phosphoryl chloride was found."
      - "data/factors/ademe_base_carbone.csv: Sulphuric acid, 0.148 kgCO2e/kg (a comparable inorganic acid-forming commodity, used as context for the low anchor)."
  "cas:110-86-1":
    low: 0.5
    high: null
    rationale: >
      Pyridine. No public cradle-to-gate factor was found. Same low-bound-only
      convention. Used here as both solvent and base within the same stage;
      both roles resolve to this one bound.
    sources:
      - "No public cradle-to-gate GWP for pyridine was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (context for the low anchor)."
