# Bounds for the materials this reaction class's screen cannot resolve to a
# public factor. See docs/bounds.md for what a bound is and, more
# importantly, what it is not: nothing here is a factor, none of it enters a
# Monte Carlo or a total, and coverage is reported unchanged.
#
# Six materials in this template are unresolved. Four of them sit on the
# chemical side, where a LOW bound is what matters (it is the floor of what
# the chemical route costs). The other two -- UDP-glucose and UDP-galactose,
# this class's two interchangeable cofactors -- are the entire enzymatic
# side, so their HIGH bound is the load-bearing one: it is what the enzyme
# has to pay, and the verdict turns on it.

bounds:

  # ---- The enzymatic side, in two interchangeable substances -------------
  "name:chebi:58885":
    low: 0.5
    high: 100.0
    rationale: >
      UDP-alpha-D-glucose. This entry used to claim it was "the whole cost of
      the enzymatic route" and "where the screen's verdict actually lives".
      Measured, that is false: `explain_verdict` puts it at under 1% of the
      delta at the published operating point, because cofactor regeneration
      divides it by the turnover number while the co-substrate that drives
      the regeneration is charged in full every cycle. Sucrose, not this, is
      the enzymatic side's largest term -- and the whole enzymatic side is
      dwarfed by the chemical template's isolation solvent. The claim was
      written before there was any way to check it, and it stood as the
      second most heavily documented entry in this file while carrying almost
      none of the answer. It is corrected here rather than quietly deleted,
      because the failure mode it illustrates -- effort tracking intuition
      rather than leverage -- is the reason `explain_verdict` exists.
      The interval below is unchanged and still worth having: it bounds a
      substance with no public cradle-to-gate factor, and it would matter for
      a class run without regeneration. The interval is set
      deliberately wide -- from below methanol (0.521, the cheapest bulk
      organic in the loaded tables) up to 100 kgCO2e/kg, well above the
      highest figure any source consulted in this project reports for a
      complex specialty (the highest is 27.3 for an ionic liquid, from
      Baaqel et al. 2023) -- precisely because it is not known. A screen that
      returns "decided" across an interval this wide is saying the verdict
      does not depend on the number; one that returns "undecided" is
      correctly saying this is the measurement worth buying. Every result
      this class produces should be read as conditional on this interval, and
      the per-material threshold column in the report gives the exact value
      at which each reaction turns over.
    sources:
      - "No public cradle-to-gate GWP for UDP-glucose was found; see data/rhea/README.md."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (the low anchor)."
  "name:chebi:66914":
    low: 0.5
    high: 100.0
    rationale: >
      UDP-alpha-D-galactose: the C4 epimer of UDP-glucose, same synthesis
      complexity (a nucleotide-diphosphate sugar), same absence of a public
      cradle-to-gate factor. No chemical basis to assign it a different
      interval from UDP-glucose's, so it carries the identical bound and the
      identical reasoning -- see "name:chebi:58885" above.
    sources:
      - "No public cradle-to-gate GWP for UDP-galactose was found; see data/rhea/README.md."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (the low anchor)."

  # ---- The chemical side --------------------------------------------------
  "cas:604-69-3":
    low: 0.5
    high: null
    rationale: >
      1,2,3,4,6-penta-O-acetyl-beta-D-glucopyranose: glucose with all five
      hydroxyls acetylated. Its cradle-to-gate footprint is bounded below by
      its own glucose content plus five acetylations; 0.5 kgCO2e/kg is below
      even the cheapest bulk organic in the loaded tables (methanol, 0.521)
      and so is a conservative floor for a five-fold-derivatised sugar. No
      ceiling asserted: a higher value only strengthens the chemical route's
      disadvantage, which is the direction this screen is testing.
    sources:
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg."
  "cas:6681-36-3":
    low: 0.5
    high: null
    rationale: >
      Boron trifluoride diethyl etherate. Made from boron trifluoride, itself
      produced from fluorspar and a boron source under strongly acidic
      conditions -- fluorine chemistry is energy-intensive, so 0.5 kgCO2e/kg
      is a very conservative floor. No ceiling asserted, same reasoning as
      above.
    sources:
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (floor anchor)."
  "cas:584-08-7":
    low: 0.3
    high: null
    rationale: >
      Potassium carbonate, a bulk inorganic. Floored just below the sodium
      hydroxide factor already held (0.458, ADEME Base Carbone) as the
      nearest bulk alkali the tables cover. No ceiling asserted.
    sources:
      - "data/factors/ademe_base_carbone.csv: Sodium hydroxide, 0.458 kgCO2e/kg, element id 20667."
  "cas:108-24-7":
    low: 0.5
    high: null
    rationale: >
      Acetic anhydride, made industrially from acetic acid via ketene. The
      acetic acid factor derived in this repository is an interval
      [0.9285, 1.857] kgCO2e/kg, and roughly 1.2 kg of acetic acid is needed
      per kg of anhydride, so a floor of 0.5 is well under a mass-balance
      bound. No ceiling asserted.
    sources:
      - "data/factors/derived.csv: acetic acid, derived interval [0.9285, 1.857] kgCO2e/kg."

  # ---- The co-substrate that pays for cofactor regeneration --------------
  # Only charged when a screen is run with cofactor_recycling > 0. It sits on
  # the ENZYMATIC side, so -- like the cofactors above and unlike the
  # chemical-side entries -- its HIGH bound is the load-bearing one.
  "name:chebi:17992":
    low: 0.1
    high: 0.754
    rationale: >
      Sucrose, consumed 4.196 times per mole of product by the sucrose
      synthase regeneration this class's template declares -- which makes it
      the largest single term on the enzymatic side, larger than the cofactor
      it regenerates. So this interval, not UDP-glucose's, is now where the
      enzymatic route's cost actually lives.
      The ceiling comes from ADEME Base Carbone / Agribalyse 3.1, the same
      openly licensed database several factors in data/factors/ already come
      from: "Sucre blanc" (element 41382) is 0.614 kgCO2e/kg net weight, and
      an older Agribalyse entry for the same product (element 34191) is
      0.754. Neither is used as a factor, deliberately: both carry the
      comment "Livraison : Ambiant (long) - Materiau d'emballage : Papier",
      so they are RETAIL packaged sugar, cradle-to-shelf, not the bulk
      technical sucrose a bioreactor is fed. That boundary mismatch is
      exactly why this stays a bound. But it makes a good ceiling, because
      stripping paper packaging and retail distribution can only reduce the
      figure -- bulk sucrose cannot cost more than the same sugar in a bag.
      The higher of the two entries is taken as that ceiling.
      The floor is left at 0.1, well below either, because no lower figure
      for bulk sucrose was found and inventing one would defeat the purpose.
      This replaces an earlier [0.1, 10] interval that had no sugar-specific
      evidence behind its ceiling at all; the 13x narrowing is the single
      largest reduction in uncertainty on the enzymatic side so far.
    sources:
      - "ADEME Base Carbone / Agribalyse 3.1, element 41382 'Sucre blanc', 0.614 kgCO2e/kg de poids net, France continentale, retrieved live from https://data.ademe.fr/data-fair/api/v1/datasets/base-carboner. Licence Ouverte / Open Licence (Etalab)."
      - "ADEME Base Carbone, element 34191 'Sucre blanc', 0.754 kgCO2e/kg de poids net -- the higher figure, taken as the ceiling."
      - "Both elements carry perimeter comment 'Livraison : Ambiant (long) - Materiau d'emballage : Papier - Preparation : Pas de preparation', i.e. retail packaged sugar rather than bulk technical sucrose."

  # ---- The enzyme itself, staged for when a loading figure exists --------
  # Not yet charged by any measure in the template: converting a per-kg-enzyme
  # GWP into a per-kg-product one needs an enzyme loading per mole of product,
  # which no source consulted states. The bound is recorded now because the
  # factor question IS settled and the loading question is not, and keeping
  # them separate is what stops the missing half being filled by guesswork.
  "name:enzyme preparation":
    low: 1.0
    high: 10.6
    rationale: >
      Cradle-to-gate GWP of industrially produced enzyme, spanning the two
      published figures that could be verified. Nielsen, Oxenboll & Wenzel
      (Int J LCA 12(6):432-438, 2007) state that contributions to global
      warming range between one and ten kg CO2-equivalents per kg FINAL
      PRODUCT for five Novozymes products; Gilpin & Andrae (Int J LCA
      22:1034-1053, 2017) report 7.9, 9.1 and 10.6 kg CO2e per kg enzyme for
      European cellulase produced from pre-treated softwood, sugar-cane
      molasses and cornstarch glucose respectively, on a FULL BROTH basis.
      Those two functional units are not the same thing, and neither is
      purified protein -- which is exactly why this is a bound and not a
      factor. The interval spans both because the basis ambiguity, not the
      measurement, is the dominant uncertainty here, and a screen that stays
      decided across it is saying the verdict does not turn on which basis
      is meant. Both sources are paywalled, so the values are cited rather
      than redistributed; nothing from them is shipped in data/factors/.
    sources:
      - "Nielsen, Oxenboll & Wenzel, Int J LCA 12(6):432-438 (2007), doi:10.1065/lca2006.08.265.1 -- 1 to 10 kg CO2e per kg final product."
      - "Gilpin & Andrae, Int J LCA 22:1034-1053 (2017), doi:10.1007/s11367-016-1208-4 -- 7.9 / 9.1 / 10.6 kg CO2e per kg enzyme, full broth."
      - "Hobusch et al., Bioresour Technol 400:130653 (2024), doi:10.1016/j.biortech.2024.130653 -- CC BY 4.0, functional unit 'one kg of rEnz recovered from batch fermentation'; its GWP values are tabulated rather than stated in prose and were not extracted."
