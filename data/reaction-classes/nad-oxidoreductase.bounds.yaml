# Bounds for the materials this reaction class's screen cannot resolve to a
# public factor. See docs/bounds.md for what a bound is and, more
# importantly, what it is not: nothing here is a factor, none of it enters a
# Monte Carlo or a total, and coverage is reported unchanged.
#
# The enzymatic side (NAD+/NADP+) carries the class's whole stoichiometric
# cost, so its HIGH bound is load-bearing, by the same convention the other
# two classes use for their cofactors. The three chemical-side reagents are
# unresolved and only their LOW bounds matter.

bounds:

  # ---- The enzymatic side -------------------------------------------------
  "name:chebi:57540":
    low: 0.5
    high: 100.0
    rationale: >
      NAD+. No public cradle-to-gate factor was found. Same interval and
      same reasoning as the cofactors in the other two shipped classes:
      deliberately wide because it is not known, spanning from below the
      cheapest bulk organic in the loaded tables up to well above the
      highest specialty figure this project has found cited.
    sources:
      - "No public cradle-to-gate GWP for NAD+ was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (the low anchor, by the same convention as the other classes)."
  "name:chebi:58349":
    low: 0.5
    high: 100.0
    rationale: >
      NADP+. Same reasoning as NAD+ above; carries an extra phosphate but
      no basis was found to assign it a different interval.
    sources:
      - "No public cradle-to-gate GWP for NADP+ was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (the low anchor, by the same convention as the other classes)."

  # ---- The chemical side ---------------------------------------------------
  "cas:7681-52-9":
    low: 0.4
    high: null
    rationale: >
      Sodium hypochlorite. No public cradle-to-gate factor was found. Low
      bound only, by the same convention every other unresolved
      chemical-side reagent in this project uses: the chemical route's
      floor is what a "the enzyme wins everywhere in the bounds" verdict
      has to clear, so the top is left open rather than inventing a
      ceiling.
    sources:
      - "No public cradle-to-gate GWP for sodium hypochlorite was found."
      - "data/factors/ademe_base_carbone.csv: Sodium hydroxide, 0.458 kgCO2e/kg (a comparable inorganic commodity, used as context for the low anchor)."
  "cas:7758-02-3":
    low: 0.4
    high: null
    rationale: >
      Potassium bromide. No public cradle-to-gate factor was found. Same
      low-bound-only convention.
    sources:
      - "No public cradle-to-gate GWP for potassium bromide was found."
      - "data/factors/ademe_base_carbone.csv: Sodium hydroxide, 0.458 kgCO2e/kg (context for the low anchor)."
  "cas:2564-83-2":
    low: 0.5
    high: null
    rationale: >
      TEMPO (2,2,6,6-tetramethylpiperidin-1-oxyl). No public cradle-to-gate
      factor was found. Same low-bound-only convention as the other two
      unresolved chemical-side reagents in this class.
    sources:
      - "No public cradle-to-gate GWP for TEMPO was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (context for the low anchor)."
