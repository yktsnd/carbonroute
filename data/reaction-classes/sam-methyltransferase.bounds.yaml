# Bounds for the materials this reaction class's screen cannot resolve to a
# public factor. See docs/bounds.md for what a bound is and, more
# importantly, what it is not: nothing here is a factor, none of it enters a
# Monte Carlo or a total, and coverage is reported unchanged.
#
# Two materials in this template are unresolved. One sits on the chemical
# side (methyl iodide), where a LOW bound is what matters. The other is
# SAM, the enzymatic side's entire stoichiometric cost, so its HIGH bound is
# the load-bearing one -- as with UDP-glucose in the glycosylation class.
# See docs/screening.md's "What a verdict is made of" before reading either
# figure as decisive: `explain_verdict` showed that in the glycosylation
# class the cofactor bound carried under 1% of any verdict once regeneration
# and a realistic process model were in the picture. Whether the same holds
# here has not yet been measured and should not be assumed.

bounds:

  # ---- The enzymatic side ---------------------------------------------
  "name:chebi:59789":
    low: 0.5
    high: 100.0
    rationale: >
      S-adenosyl-L-methionine. No public cradle-to-gate factor was found.
      Same interval and same reasoning as UDP-glucose in the glycosylation
      class (data/reaction-classes/udp-glucosyltransferase.bounds.yaml):
      deliberately wide because it is not known, spanning from below the
      cheapest bulk organic in the loaded tables up to well above the
      highest specialty figure this project has found cited (27.3, an ionic
      liquid). A screen decided across an interval this wide is saying the
      verdict does not depend on the number.
    sources:
      - "No public cradle-to-gate GWP for S-adenosyl-L-methionine was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (the low anchor, by the same convention as the glycosylation class)."

  # ---- The chemical side ------------------------------------------------
  "cas:74-88-4":
    low: 0.5
    high: null
    rationale: >
      Methyl iodide. No public cradle-to-gate factor was found. Low bound
      only, by the same convention every other unresolved chemical-side
      reagent in this project uses (e.g. the glycosylation class's donor and
      promoter): the chemical route's floor is what a "the enzyme wins
      everywhere in the bounds" verdict has to clear, so leaving the top
      open is the honest position rather than inventing a ceiling. Anchored
      at the same low value as the comparable unresolved reagents in the
      glycosylation class.
    sources:
      - "No public cradle-to-gate GWP for methyl iodide was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (the low anchor, by the same convention as the glycosylation class)."
  "cas:584-08-7":
    low: 0.3
    high: null
    rationale: >
      Potassium carbonate. Same substance, same unresolved status and same
      bound as in the glycosylation class's bounds file -- reproduced here
      because bounds are scoped per class template, not shared globally.
    sources:
      - "No public cradle-to-gate GWP for potassium carbonate was found."
      - "data/factors/ademe_base_carbone.csv: Sodium hydroxide, 0.458 kgCO2e/kg (a comparable inorganic base, used as context for the low anchor)."
