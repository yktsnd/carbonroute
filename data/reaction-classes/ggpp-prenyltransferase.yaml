# Reaction class: GGPP-dependent prenylation
#
# Covers Rhea reactions consuming geranylgeranyl diphosphate (GGPP,
# CHEBI:58756) as a reactant. No ec_prefix is declared -- see the
# ec_prefix-removal note below. GGPP is the four-isoprene-unit allylic
# diphosphate donor -- the last sibling of the
# DMAPP class (data/reaction-classes/dmapp-prenyltransferase.yaml), same
# transformation, a longer donor still.
#
# Net mass added: the geranylgeranyl group, C20H32, 272.476 g/mol -- four
# times the DMAPP class's 68.119. Same charge-state situation as the DMAPP,
# GPP and FPP classes: donor and leaving group are drawn in the same charge
# state.
#
# No transferred_bond_smarts, for the same reason as the DMAPP class.
#
# CORRECTION: an earlier version of this file claimed 9 matched / 4
# decided. That 4 wrongly included RHEA:25694 (isopentenyl diphosphate +
# GGPP = geranylfarnesyl diphosphate + diphosphate) -- polyprenyl
# synthase, GGPP condensing with exactly ONE isopentenyl diphosphate (IPP)
# equivalent, not prenylation of a foreign nucleophile: the same
# single-IPP-hop confound documented on the DMAPP class's own CORRECTION,
# arithmetically indistinguishable from a real transfer by mass delta
# alone. `excluded_co_cofactor_chebi` below excludes isopentenyl
# diphosphate (CHEBI:128769) from matching entirely, fixing this and
# RHEA:27555/RHEA:27594 (the multi-IPP chain elongations already
# documented as excluded, now excluded earlier and more honestly, at the
# match itself rather than downstream by mass delta).
#
# With EC 2.5.1 still in place and IPP excluded: 6 reactions match GGPP.
# 3 (50%) resolve within tolerance and are decided, all decisively
# favouring the enzyme -- including RHEA:49228 (bacteriochlorophyllide a +
# GGPP + H(+) = geranylgeranyl-bacteriochlorophyllide a + diphosphate),
# which only decides once a proton on the left of the equation is
# excluded from the acceptor search the same way one on the right already
# was -- see screen.py's _identify docstring. The other 3: RHEA:34475
# (2 GGPP -> phytoene, a GGPP homodimerisation with no foreign acceptor at
# all) could not be resolved to a single acceptor/product pair; RHEA:38003
# is a prenylation-with-decarboxylation losing CO2 alongside diphosphate,
# a genuinely different net mass; RHEA:58176 consumes a second cofactor
# (NADPH) alongside GGPP in a reductive prenylation that adds a different
# mass again.
#
# ec_prefix removal (the same step taken for SAM-methyltransferase,
# ATP-kinase and the DMAPP/GPP/FPP classes, safe here only because the IPP
# fix above closed the one false-positive path mass delta alone could not
# catch): with EC 2.5.1 dropped too, 55 reactions match GGPP excluding
# IPP, and 5 decide, all decisively favouring the enzyme. Both newly
# decided members were spot-checked and are genuine EC-less
# geranylgeranylations of a real organic acceptor (menadiol -> menaquinol-4,
# a vitamin K biosynthesis step; triacetate lactone) -- neither is chain
# elongation, homodimerisation or a water/proton artefact.

reaction_class:
  id: ggpp-prenyltransferase
  name: "GGPP-dependent prenylation"
  description: >
    Enzymatic transfer of the geranylgeranyl group from GGPP onto a
    nucleophilic acceptor (O-, C- or S-prenylation), releasing diphosphate.
    Matched on GGPP specifically (not DMAPP, GPP or FPP, which transfer a
    different mass); no ec_prefix is declared. Isopentenyl diphosphate (IPP,
    CHEBI:128769) is excluded outright: a single IPP equivalent condensing
    with GGPP is chain elongation, not prenylation of a foreign acceptor
    -- see the CORRECTION above.
  expected_mass_delta: 272.476
  mass_delta_tolerance: 1.0
  cofactor_chebi: "CHEBI:58756"
  cofactor_role: reagent
  excluded_co_cofactor_chebi: "CHEBI:128769"

chemical_counterpart:
  name: "Declared process model only -- see process_model below"
  source: >
    No chemical_counterpart.materials are declared for this class; it ships
    with a process_model instead (see below) and must be screened with
    --process-model. Same rationale as the other process-model-only
    classes: see docs/screening.md's "A declared process, instead of one
    paper's bench run".
  materials: []

# --- The chemical route as a declared process -------------------------------
process_model:
  name: "Geranylgeranyl bromide alkylation with a mild base, at process concentration"
  source: >
    Not a paper. Geranylgeranyl bromide (CAS 50848-64-1, verified via web
    search rather than memory) with a mild base is the direct
    twenty-carbon analogue of the DMAPP class's prenyl bromide route.
    Parameters stated on the same terms the other process models use.
  reaction_concentration_M: 0.2
  stage_yield: 0.85
  note: >
    No protection stage is modelled, for the same conservative reason the
    other process-model classes omit one.
  stages:

    - id: prenylate
      volumes: 1.0
      solvent: {name: acetone, cas: "67-64-1", density_kg_per_L: 0.791}
      reagents:
        - name: geranylgeranyl bromide
          cas: "50848-64-1"
          kg_per_mol: 0.353388
          equivalents: 1.3
          note: >
            1.3 equivalents of the alkylating agent -- modest excess, same
            order as the DMAPP class's prenyl bromide loading.
        - name: potassium carbonate
          cas: "584-08-7"
          kg_per_mol: 0.138205
          equivalents: 2.0
          note: >
            Base to neutralise the HBr generated and keep the nucleophile
            deprotonated -- same loading as the DMAPP class's base.

    - id: isolate
      volumes: 5.0
      solvent: {name: ethyl acetate, cas: "141-78-6", density_kg_per_L: 0.902}
      reagents: []
