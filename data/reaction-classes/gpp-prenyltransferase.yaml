# Reaction class: GPP-dependent prenylation
#
# Covers Rhea reactions consuming geranyl diphosphate (GPP, CHEBI:58057) as a
# reactant, restricted to EC 2.5.1. GPP is the two-isoprene-unit allylic
# diphosphate donor -- the sibling of the DMAPP class
# (data/reaction-classes/dmapp-prenyltransferase.yaml), covering the same
# transformation (a nucleophile displaces diphosphate at C1 of the allylic
# system) with a longer donor. It is not folded into the DMAPP class because
# it transfers twice the mass: DMAPP adds one isoprenyl unit, GPP adds two,
# and the current template schema has one expected_mass_delta per class.
#
# Net mass added: the geranyl group, C10H16, 136.238 g/mol -- exactly twice
# the DMAPP class's 68.119, confirmed directly against RHEA:17449 (flaviolin
# -> 3-linalylflaviolin, product 341.383 g/mol minus acceptor 205.145 g/mol
# = 136.238). Same charge-state situation as the DMAPP class: donor and
# leaving group are drawn in the same charge state, so no offset applies.
#
# No transferred_bond_smarts, for the same reason as the DMAPP class: many
# acceptors in this class are natural products that already carry an
# unrelated isoprenyl-derived alkene, so "one more C=C" is not a clean
# discriminator, and the mass-delta check alone is the class-purity test.
#
# CORRECTION: an earlier version of this file claimed 11 matched / 10
# decided. That 10 wrongly included RHEA:19361 and RHEA:23300 (isopentenyl
# diphosphate + GPP = (E)- or (Z)-farnesyl diphosphate + diphosphate) --
# FPP synthase, GPP condensing with exactly ONE isopentenyl diphosphate
# (IPP) equivalent, not prenylation of a foreign nucleophile. As on the
# DMAPP class, a single IPP hop is arithmetically indistinguishable from a
# real transfer by mass delta alone (product_mw - IPP_mw always equals
# GPP's own transferred-group mass, 136.238, regardless of what GPP
# actually reacted with) -- see the DMAPP class's own CORRECTION for the
# full explanation. `excluded_co_cofactor_chebi` below excludes
# isopentenyl diphosphate (CHEBI:128769) from matching entirely, fixing
# this and RHEA:27563 (the multi-IPP chain elongation already documented
# as excluded, now excluded earlier and more honestly, at the match
# itself rather than downstream by mass delta).
#
# Structural verification (run through the actual screen, with the fix
# applied): 8 reactions match GPP + EC 2.5.1 excluding IPP, and all 8
# (100%) resolve to a single acceptor/product pair within tolerance and
# are decided, every one decisively favouring the enzyme -- including
# RHEA:33839 (2-O,3-dimethylflaviolin + GPP + H(+) =
# 7-O-geranyl-2-O,3-dimethylflaviolin + diphosphate), which only decides
# once a proton on the left of the equation is excluded from the acceptor
# search the same way one on the right already was -- see screen.py's
# _identify docstring.

reaction_class:
  id: gpp-prenyltransferase
  name: "GPP-dependent prenylation"
  description: >
    Enzymatic transfer of the geranyl group from GPP onto a nucleophilic
    acceptor (O-, C- or S-prenylation), releasing diphosphate. Matched on
    GPP specifically (not DMAPP, FPP or GGPP, which transfer a different
    mass), restricted to EC 2.5.1. Isopentenyl diphosphate (IPP,
    CHEBI:128769) is excluded outright: a single IPP equivalent condensing
    with GPP is chain elongation to FPP, not prenylation of a foreign
    acceptor -- see the CORRECTION above.
  expected_mass_delta: 136.238
  mass_delta_tolerance: 1.0
  cofactor_chebi: "CHEBI:58057"
  cofactor_role: reagent
  ec_prefix: "2.5.1"
  excluded_co_cofactor_chebi: "CHEBI:128769"

chemical_counterpart:
  name: "Declared process model only -- see process_model below"
  source: >
    No chemical_counterpart.materials are declared for this class; it ships
    with a process_model instead (see below) and must be screened with
    --process-model. Same rationale as the other process-model-only
    classes: see docs/screening.md's "A declared process, instead of one
    paper's bench run".
  materials: []

# --- The chemical route as a declared process -------------------------------
process_model:
  name: "Geranyl bromide alkylation with a mild base, at process concentration"
  source: >
    Not a paper. Geranyl bromide (CAS 6138-90-5, verified via web search
    rather than memory) with a mild base is the direct ten-carbon analogue
    of the DMAPP class's prenyl bromide route -- the same Williamson-type
    alkylation, with the alkylating agent swapped for the electrophile this
    class actually transfers. Parameters stated on the same terms the other
    process models use.
  reaction_concentration_M: 0.2
  stage_yield: 0.85
  note: >
    No protection stage is modelled, for the same conservative reason the
    other process-model classes omit one.
  stages:

    - id: prenylate
      volumes: 1.0
      solvent: {name: acetone, cas: "67-64-1", density_kg_per_L: 0.791}
      reagents:
        - name: geranyl bromide
          cas: "6138-90-5"
          kg_per_mol: 0.217150
          equivalents: 1.3
          note: >
            1.3 equivalents of the alkylating agent -- modest excess, same
            order as the DMAPP class's prenyl bromide loading.
        - name: potassium carbonate
          cas: "584-08-7"
          kg_per_mol: 0.138205
          equivalents: 2.0
          note: >
            Base to neutralise the HBr generated and keep the nucleophile
            deprotonated -- same loading as the DMAPP class's base.

    - id: isolate
      volumes: 5.0
      solvent: {name: ethyl acetate, cas: "141-78-6", density_kg_per_L: 0.902}
      reagents: []
