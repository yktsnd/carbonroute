# Reaction class: GDP-fucose-dependent fucosylation
#
# Covers Rhea reactions consuming GDP-beta-L-fucose (CHEBI:57273) as a
# reactant: enzymatic transfer of the fucosyl unit onto an acceptor hydroxyl
# (O-fucosylation of an oligosaccharide, glycolipid or glycoprotein glycan),
# releasing GDP. This is the fucosyltransferase family -- the enzymes behind
# human-milk-oligosaccharide fucosylation (RHEA:14257 among them, already
# named in this project's own Q3 target list), the Lewis/ABO blood-group
# antigens, and selectin-ligand biosynthesis.
#
# Net mass added: the fucosyl group (a 6-deoxyhexose, C6H10O4, 146.14 g/mol
# -- fucose itself, C6H12O5, minus the water lost in glycosidic bond
# formation). Verified directly against RHEA:14257 (a beta-D-galactosyl-
# (1->4)-N-acetyl-beta-D-glucosaminyl derivative -> its 3-O-fucosylated
# derivative, product 528.484 g/mol minus acceptor 382.342 g/mol = 146.142
# exactly) and RHEA:42040 (ganglioside GM1 -> ganglioside Fuc-GM1, product
# 1452.508 minus acceptor 1306.366 = 146.142 exactly), a much larger
# acceptor giving the identical delta -- confirming the mass math tracks
# the transferred group alone, independent of acceptor size. No charge-
# state split found: unlike several other classes this session, this
# donor's leaving group (GDP) and the acceptor/product pair are drawn in
# consistent protonation states throughout the resolvable set.
#
# No ec_prefix is declared: the mass-delta check alone already separates
# this class cleanly (see below), and EC annotation is incomplete (58.9%
# of Rhea carries none) the same way it is everywhere else in this
# project.
#
# Structural verification (run through the actual screen): 77 reactions
# match GDP-fucose. 76 (98.7%) resolve to a single acceptor/product pair
# within one proton of 146.14 and are decided, every one decisively
# favouring the enzyme -- the same signal-to-noise ratio the
# PAPS-sulfotransferase class shows. The other 1, RHEA:18885 (GDP-fucose +
# NADP(+) = GDP-4-dehydro-alpha-D-rhamnose + NADPH + H(+)), is GDP-fucose
# SYNTHASE -- the biosynthetic route that MAKES GDP-fucose from a GDP-
# mannose-derived precursor, oxidising it rather than transferring it to
# any acceptor -- a genuinely different transformation this class does not
# attempt to handle, correctly excluded by mass delta (-155.07, nowhere
# near 146.14).

reaction_class:
  id: gdp-fucosyltransferase
  name: "GDP-fucose-dependent fucosylation"
  description: >
    Enzymatic transfer of the fucosyl unit from GDP-beta-L-fucose onto an
    acceptor hydroxyl, releasing GDP. Matched on GDP-fucose alone; no
    ec_prefix is declared.
  expected_mass_delta: 146.14
  mass_delta_tolerance: 1.0
  cofactor_chebi: "CHEBI:57273"
  cofactor_role: reagent

chemical_counterpart:
  name: "Declared process model only -- see process_model below"
  source: >
    No chemical_counterpart.materials are declared for this class; it
    ships with a process_model instead (see below) and must be screened
    with --process-model. Same rationale as the other process-model-only
    classes: see docs/screening.md's "A declared process, instead of one
    paper's bench run".
  materials: []

# --- The chemical route as a declared process -------------------------------
process_model:
  name: "Koenigs-Knorr fucosylation with a pre-formed bromide donor, then deacetylation"
  source: >
    Not a paper. 2,3,4-Tri-O-acetyl-alpha-L-fucopyranosyl bromide (CAS
    16741-27-8) with silver carbonate is the textbook Koenigs-Knorr route
    for fucosylation -- the standard laboratory method for a pre-formed
    glycosyl bromide donor, the same mechanism the
    udp-glucuronosyltransferase class's own methyl acetobromoglucuronate
    donor uses, with the leaving group and protecting-group count swapped
    for fucose's own structure (a deoxyhexose triacetate, no methyl ester,
    since fucose carries no carboxylate the way glucuronate does).
    Deacetylation with sodium hydroxide then removes the three acetate
    protecting groups, giving the free fucoside the enzymatic product also
    is. Parameters stated on the same terms the other process models use.
  reaction_concentration_M: 0.2
  stage_yield: 0.8
  note: >
    No protection stage for the acceptor's own other reactive groups is
    modelled, for the same conservative reason the other process-model
    classes omit one -- it makes the chemical route look better than it is
    for polyfunctional acceptors, not worse, so it is not a thumb on the
    scale for "the enzyme wins".
  stages:

    - id: glycosylate
      volumes: 1.0
      solvent: {name: dichloromethane, cas: "75-09-2", density_kg_per_L: 1.325}
      reagents:
        - name: 2,3,4-tri-O-acetyl-alpha-L-fucopyranosyl bromide
          cas: "16741-27-8"
          kg_per_mol: 0.35316
          equivalents: 1.3
          note: >
            1.3 equivalents of the pre-formed glycosyl bromide donor --
            modest excess, standard for this reaction, the same loading
            the udp-glucuronosyltransferase class's own donor uses.
        - name: silver carbonate
          cas: "534-16-7"
          equivalents: 1.1
          kg_per_mol: 0.275745
          note: >
            The Koenigs-Knorr promoter, activating the anomeric bromide
            for substitution. 1.1 equivalents, standard loading.

    - id: deprotect
      volumes: 3.0
      solvent: {name: methanol, cas: "67-56-1", density_kg_per_L: 0.792}
      reagents:
        - name: sodium hydroxide
          cas: "1310-73-2"
          kg_per_mol: 0.02
          equivalents: 4.0
          note: >
            Saponification of the three sugar acetates -- 3 ester bonds
            cleaved, 4 equivalents of base for complete hydrolysis with a
            modest excess.

    - id: isolate
      volumes: 5.0
      solvent: {name: ethyl acetate, cas: "141-78-6", density_kg_per_L: 0.902}
      reagents: []
