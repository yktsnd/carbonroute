# Bounds for the materials this reaction class's screen cannot resolve to a
# public factor. See docs/bounds.md for what a bound is and, more
# importantly, what it is not: nothing here is a factor, none of it enters a
# Monte Carlo or a total, and coverage is reported unchanged.

bounds:

  # ---- The enzymatic side -------------------------------------------------
  "name:chebi:57945":
    low: 0.5
    high: 100.0
    rationale: >
      NADH. No public cradle-to-gate factor was found. Same interval and
      same reasoning as this class's own NADPH sibling
      (nadph-ketoreductase) and the other cofactors in the shipped
      classes: deliberately wide because it is not known.
    sources:
      - "No public cradle-to-gate GWP for NADH was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (the low anchor, by the same convention as the other classes)."

  # ---- The chemical side ---------------------------------------------------
  "cas:16940-66-2":
    low: 0.5
    high: null
    rationale: >
      Sodium borohydride. No public cradle-to-gate factor was found. Low
      bound only, by the same convention every other unresolved
      chemical-side reagent in this project uses.
    sources:
      - "No public cradle-to-gate GWP for sodium borohydride was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (context for the low anchor)."
