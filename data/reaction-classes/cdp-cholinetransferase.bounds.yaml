# Bounds for the materials this reaction class's screen cannot resolve to a
# public factor. See docs/bounds.md for what a bound is and, more
# importantly, what it is not: nothing here is a factor, none of it enters a
# Monte Carlo or a total, and coverage is reported unchanged.

bounds:

  # ---- The enzymatic side -------------------------------------------------
  "name:chebi:58779":
    low: 0.5
    high: 100.0
    rationale: >
      CDP-choline. No public cradle-to-gate factor was found. Same interval
      and same reasoning as the cofactors in the other shipped classes:
      deliberately wide because it is not known, spanning from below the
      cheapest bulk organic in the loaded tables up to well above the
      highest specialty figure this project has found cited.
    sources:
      - "No public cradle-to-gate GWP for CDP-choline was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (the low anchor, by the same convention as the other classes)."

  # ---- The chemical side ---------------------------------------------------
  "cas:6609-64-9":
    low: 0.5
    high: null
    rationale: >
      2-Chloro-2-oxo-1,3,2-dioxaphospholane ("COP"), the cyclic
      chlorophosphate phosphorylating agent. No public cradle-to-gate
      factor was found. Low bound only, by the same convention every other
      unresolved chemical-side reagent in this project uses.
    sources:
      - "No public cradle-to-gate GWP for 2-chloro-2-oxo-1,3,2-dioxaphospholane was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (context for the low anchor)."
  "cas:75-50-3":
    low: 0.5
    high: null
    rationale: >
      Trimethylamine, the ring-opening amine that installs the choline
      headgroup. No public cradle-to-gate factor was found. Low bound
      only, same convention as the rest of this file.
    sources:
      - "No public cradle-to-gate GWP for trimethylamine was found."
      - "data/factors/ademe_base_carbone.csv: Methanol, 0.521 kgCO2e/kg (context for the low anchor)."
