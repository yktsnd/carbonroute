substance:
  name: ammonia
  cas: "7664-41-7"
  inchikey: QGZKDVFQNNGYKY-UHFFFAOYSA-N

route:
  name: "Steam reforming of natural gas (Haber-Bosch synthesis)"
  description: >
    Dominant industrial route (~80% of world ammonia capacity uses natural
    gas as feedstock, per Table 2.2 of the source BREF). Natural gas is
    steam-reformed to synthesis gas (H2 + N2, via a primary reformer using
    process steam and a secondary reformer fed with process air), shifted,
    purified (CO2 removal, methanation), then compressed and reacted over an
    iron catalyst in the Haber-Bosch loop. The overall net reaction is given
    below; the natural gas feedstock's mass is not stated in the source (see
    gaps) so inputs are given as the reaction's own H2/N2, whose consumption
    the source states for N2 (as process air) and approximates for H2 via
    stoichiometry.
  stoichiometry: "N2 + 3 H2 -> 2 NH3"

inputs:
  - name: nitrogen (as process air)
    cas: "7727-37-9"
    kg_per_kg_product: 0.85
    basis: stated
    source:
      document: "EC JRC/EIPPCB, 'Reference Document on Best Available Techniques for the Manufacture of Large Volume Inorganic Chemicals - Ammonia, Acids and Fertilisers' (LVIC-AAF BREF), August 2007"
      url: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf"
      locator: "Section 2.3.2 (Table under 'Other reported consumption levels'), p.81 of PDF: 'Process air ... Conventional steam reforming ... 1.1 kg air/kg NH3 ... Equal to 0.85 kg N2/kg NH3'"
  - name: hydrogen
    cas: "1333-74-0"
    kg_per_kg_product: 0.1776
    basis: stoichiometric
    source:
      document: "Derived from the balanced Haber-Bosch equation N2 + 3H2 -> 2NH3 and standard atomic weights (H=1.008, N=14.007)."
      url: null
      locator: "Arithmetic; not from the BREF, which does not state a hydrogen mass figure directly (only natural gas energy content, see energy.fuel_MJ_per_kg source)."
  - name: process steam (water)
    cas: "7732-18-5"
    kg_per_kg_product: 0.65
    basis: stated
    source:
      document: "EC JRC/EIPPCB, LVIC-AAF BREF, August 2007"
      url: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf"
      locator: "Section 2.3.2, p.81 of PDF: 'Process steam ... Steam reforming ... 0.6-0.7 kg/kg NH3 ... At stoichiometric conversion' [1, EFMA 2000; 6, German UBA 2000; 9, Austrian UBA 2002]. Midpoint of the stated 0.6-0.7 range used; range recorded in notes."

energy:
  fuel_MJ_per_kg: 29.7
  fuel_source:
    document: "EC JRC/EIPPCB, LVIC-AAF BREF, August 2007"
    url: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf"
    locator: "Table 2.14 'Energy consumption levels associated with BAT', p.120 of PDF: 'Conventional reforming processes, processes with reduced primary reforming or heat exchange autothermal reforming: 27.6-31.8 GJ(LHV)/tonne NH3.' Midpoint of the stated range used (29.7 GJ/t = 29.7 MJ/kg); range recorded in notes."

notes: |
  This figure is total NET primary energy (feedstock's chemical energy
  converted to H2, plus fuel burned for process heat, plus a site-specific
  electricity-import equivalent per the BREF's own footnote to Table 2.6:
  "the net energy consumption level is influenced by the site specific
  conversion factor for the imported electricity") -- it is NOT a utility-fuel
  figure on top of a separately accounted natural-gas mass. Because this
  ledger provides no separate natural-gas feedstock mass line (see gaps), all
  of the natural gas's energy content -- both as chemical feedstock for H2
  production and as furnace fuel -- is captured here in fuel_MJ_per_kg, so
  there is no double count.

  Table 2.6 of the source ('Reported energy consumption levels for the
  production of ammonia') gives a wider, more scattered set of literature
  values by process variant, all steam-reforming-based: e.g. 'Steam
  reforming in general' feedstock 22-25 + fuel 4-9 GJ/t (EFMA/German UBA),
  individual plant reports of 27.6-35.1 GJ/t. Table 2.14's narrower BAT range
  (27.6-31.8 GJ/t) was used here because it is the document's own BAT-level
  summary figure for conventional/reduced-primary-reforming/heat-exchange
  autothermal routes together, which is the process family covering ~80% of
  world capacity (Table 2.2). Partial-oxidation routes (heavy
  hydrocarbon/coal feedstock, the remaining ~20%) run 33-42 GJ/t and are not
  used here.

  Table 2.3 ('Cost differences and total energy demands for ammonia
  production', source [3, European Commission 1997]) gives an older,
  single-point comparison: natural gas/steam reforming 28 GJ/t NH3 (marked
  "best achieved data" at that time) vs. heavy hydrocarbons/partial
  oxidation 38 GJ/t vs. coal/partial oxidation 48 GJ/t -- consistent with,
  though not the source of, the range used above.

  The stoichiometric H2 input (0.1776 kg/kg) is a lower bound on real
  hydrogen consumption: industrial ammonia synthesis is not run to 100%
  per-pass conversion and carries a purge-gas loss, so actual H2 intake
  (via natural gas + steam reforming) exceeds the stoichiometric amount by
  an unstated margin -- this is exactly why the BREF's own energy figures
  (which do reflect real feedstock+fuel losses) are preferred over a
  stoichiometric-based estimate for the energy line.

gaps:
  - "No natural-gas feedstock MASS (kg or Nm3 per kg NH3) is stated anywhere
    found in the BREF; only its energy content (GJ/t, used above) and
    process-air/process-steam mass figures are given. A natural gas input
    line with basis 'stated' could not be added."
  - "No overall ammonia synthesis yield/conversion percentage (e.g. per-pass
    or overall, accounting for purge losses) was found in the BREF."
  - "No electricity kWh/kg figure specific to ammonia synthesis was found;
    Table 2.6's 'Net' energy figures are noted (footnote 'x') to already
    include 'the site specific conversion factor for the imported
    electricity', so electricity is embedded in fuel_MJ_per_kg above, not
    broken out separately."
  - "Only the LVIC-AAF BREF (JRC/EIPPCB, 2007) was consulted for this entry;
    a newer 2022 BAT Conclusions Implementing Decision exists
    (https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-03/LVIC-AAF.pdf)
    but was not used because it is a short (~20-page) conclusions-only
    document without the underlying consumption tables the 2007 background
    document provides."
