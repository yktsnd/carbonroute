route:
  name: "Fractional distillation from natural gas liquids / light naphtha"
  description: >
    n-Pentane is not synthesised by a chemical reaction in its dominant
    commercial route: it is recovered by fractional distillation of natural
    gas liquids (NGLs) or light straight-run naphtha, then further
    separated from isopentane and cyclic C5s (e.g. by superfractionation or
    molecular-sieve adsorption) for higher-purity grades. See
    data/processes/n-heptane.yaml, which documents the same "no source
    found" outcome for the paraffinic-solvent-separation case in general;
    that file's notes apply equally here and are not repeated.
  stoichiometry: null

