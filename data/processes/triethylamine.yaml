energy: {}

notes: |
  Route-choice caveat: Chinese patent CN114716325A, "Method for continuously
  preparing triethylamine" (https://patents.google.com/patent/CN114716325A/en),
  states plainly: "The synthesis process of the present industrialized
  triethylamine is mainly an ethanol hydroamination method, wherein ethanol,
  ammonia gas and hydrogen gas are preheated and gasified according to a
  certain proportion, the reaction is carried out by a fixed bed..." --
  i.e. ethanol + ammonia + H2 over a heterogeneous (there: Ni-based) catalyst
  is described as the actual dominant industrial process, not the
  acetonitrile route used in this file. That patent gives real reaction
  conditions (160-230C, 1-10 MPa, ethanol:ammonia molar ratio 1-4:1) across
  eleven numbered examples, but its quantitative results (conversion,
  selectivity) are reported only in "Table 1", which on Google Patents is
  rendered as an image and was not machine-readable in this session -- no
  numeric figure from it could be quoted with confidence. US Patent
  Application 20070112218A1 similarly confirms ethanol+ammonia+H2
  hydroamination as the industrial method (background section) but its
  own worked examples concern feedstock (bioethanol) desulfurisation, not
  amine yield. Because both feedstocks of the ethanol+ammonia route
  (ethanol, ammonia) already have factors in data/factors, a future
  contributor who can source a real yield number for that route (e.g. by
  requesting the CN114716325A table via a different retrieval path) would
  produce a materially more useful recipe than this one.

  The acetonitrile-hydrogenation route used here, by contrast, does NOT
  chain to a held factor (acetonitrile itself is on carbonroute's target
  list and has no recipe of its own here -- see acetonitrile.yaml gaps) --
  so this recipe currently derives nothing further upstream than
  acetonitrile and hydrogen, both external floor inputs.

gaps:
  - "No process energy (electricity or fuel/steam) figure was found for
    either the acetonitrile-hydrogenation route used here or the
    ethanol-amination route described as dominant."
  - "Could not confirm, from a document actually retrieved and read, the
    relative market share of the acetonitrile-hydrogenation route vs. the
    ethanol-hydroamination route; only the CN114716325A patent's own
    (unverifiable-elsewhere) assertion that ethanol hydroamination is 'the
    industrialized' method."
  - "CN114716325A's Table 1 (conversion/selectivity data for its eleven
    examples) could not be extracted as text from the Google Patents HTML
    retrieved in this session; a future session should try Espacenet or
    the USPTO/WIPO PDF directly."
