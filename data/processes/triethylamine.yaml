substance:
  name: triethylamine
  cas: "121-44-8"
  inchikey: ZMANZCXQSJIPKH-UHFFFAOYSA-N

route:
  name: "Hydrogenation of acetonitrile (a by-product of acrylonitrile manufacture)"
  description: >
    Acetonitrile -- typically the purified by-product stream from propylene
    ammoxidation to acrylonitrile (the SOHIO process) -- is hydrogenated
    over a noble-metal-on-lithium-aluminium-spinel catalyst, with
    recirculation of the mono-/di-ethylamine intermediates, to give
    triethylamine as the major product alongside ammonia. See notes below:
    this is NOT confirmed as the dominant global route (see gaps) --
    catalytic amination of ethanol with ammonia and hydrogen is described
    elsewhere as "the" industrialised process, but no quantitative yield for
    that route could be retrieved (see notes); this route is used because it
    is the one for which a real, quoted yield figure was found.
  stoichiometry: "3 CH3CN (acetonitrile) + 6 H2 -> N(C2H5)3 (triethylamine) + 2 NH3"
  yield: 0.965
  yield_source:
    document: "US Patent 4,297,512 A, 'Process for the preparation of triethylamine' (Bayer AG)"
    url: "https://patents.google.com/patent/US4297512A/en"
    locator: >
      Continuous hydrogenation example (following 'Example 1'): "The bottom
      product stream removed contained 99.5% of triethylamine, with a total
      yield of 96.5% of theory." Reaction run at ~105 C, 17 atmospheres,
      over a Pt/vanadium-doped lithium-aluminium-spinel catalyst; acetonitrile
      fed as a 99.0% pure worked-up by-product of acrylonitrile manufacture.

inputs:
  - name: acetonitrile
    cas: "75-05-8"
    kg_per_kg_product: 1.2170
    basis: stoichiometric
    source:
