# Letermovir cradle-to-gate benchmark ledger (carbonroute B2).
#
# Generated by scripts/extract_letermovir_ledger.py from the published LCA
# workbook (Sorgenfrei et al., J. Am. Chem. Soc. 2025, 147, 40944-40957,
# doi:10.1021/jacs.5c14470, PMC12593353, SI file ja5c14470_si_002.xlsx).
# Full provenance, role mapping, and CAS resolution log: SOURCES.md in this
# directory. DO NOT hand-edit masses here -- re-run the extraction script.
#
# yield: 1.0 on every step is deliberate, not a placeholder: the workbook's
# 'Mass Stoich' masses are already back-calculated by the paper's authors to
# the functional unit (1 kg letermovir out). Applying carbonroute's own yield
# conversion on top would double-count the yield loss. Each step's own
# *published* yield (where the sheet gives one) is noted in a comment next to
# that step instead, purely for a reader's reference.
#
# electricity_kWh: 0.0 on every step is also deliberate: the published
# inventory in this workbook is material-only. Process energy is out of scope
# for this benchmark; no energy figure has been invented or estimated.
schema_version: "0.1"

assumptions:
  functional_unit: {mass_kg: 1.0, basis: product}
  boundary: cradle-to-gate
  # No electricity is charged anywhere in this benchmark (see note above), so
  # the grid factor is a documented zero, not an uncited placeholder.
  grid_factor:
    id: "none-charged"
    value_kgCO2e_per_kWh: 0.0
    source: "This benchmark charges no electricity_kWh anywhere (material-only
      published inventory, see benchmarks/letermovir/SOURCES.md); the grid
      factor is unused by construction and is set to 0 rather than left to an
      analyst-declared placeholder."
    uncertainty_class: assumption
  # The paper itself reports GWP100a per IPCC 2021 (AR6); recorded here as the
  # nominal method label. See SOURCES.md -- this benchmark's own numbers are
  # computed from public factor tables, not from the paper's ecoinvent run, so
  # this label describes intent/comparability, not a reproduction of the paper's
  # own GWP methodology chain.
  gwp_method: {name: IPCC-AR6, horizon_years: 100, feedbacks: false}
  solvent_recovery_default: 0.0
  waste_treatment: excluded

